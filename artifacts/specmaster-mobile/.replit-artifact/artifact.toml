kind = "mobile"
previewPath = "/specmaster-mobile/"
title = "SpecMaster Mobile"
description = "A mobile companion for construction teams to review project specifications, check budget variance, and make quick field updates from anywhere."
version = "1.0.0"
id = "artifacts/specmaster-mobile"
router = "expo-domain"

[[services]]
name = "expo"
ensurePreviewReachable = "/status"
paths = [ "/specmaster-mobile/" ]
localPort = 22343

[services.development]
run = "pnpm --filter @workspace/specmaster-mobile run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/specmaster-mobile", "run", "build" ]
run = [ "pnpm", "--filter", "@workspace/specmaster-mobile", "run", "serve" ]

[services.env]
PORT = "22343"
BASE_PATH = "/specmaster-mobile/"
