kind = "web"
previewPath = "/"
title = "SpecMaster"
description = "A construction specification management workspace for AEC teams to organize project materials, compare supplier quotes, and keep every budget decision visible in one place."
version = "1.0.0"
id = "artifacts/specmaster-web"
router = "path"

[[services]]
name = "web"
paths = [ "/" ]
localPort = 21233

[services.development]
run = "pnpm --filter @workspace/specmaster-web run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/specmaster-web", "run", "build" ]
serve = "static"
publicDir = "artifacts/specmaster-web/dist/public"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"

[services.env]
PORT = "21233"
BASE_PATH = "/"
